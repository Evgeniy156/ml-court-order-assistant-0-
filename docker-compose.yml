services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: app
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@database:5432/ml_court}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-ml_tasks}
      - SECRET_KEY=${SECRET_KEY:-change-me-secret-key}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    expose:
      - "8000"

  web-proxy:
    image: nginx:alpine
    container_name: web-proxy
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:80"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    restart: on-failure

  database:
    image: postgres:15
    container_name: database
    environment:
      POSTGRES_DB: ml_court
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  telegram-bot:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: telegram-bot
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@database:5432/ml_court}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-ml_tasks}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-secret-key}
    depends_on:
      - app
      - rabbitmq
      - database
    command: ["python", "src/telegram_bot.py"]
    restart: on-failure
